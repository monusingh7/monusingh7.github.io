---
---
<div class="publication">
  <p>
    <strong>{{ entry.title }}</strong><br>
    <em>{{ entry.author }}</em><br>
    {{ entry.journal }}{% if entry.year %}, {{ entry.year }}{% endif %}
    
    {% if entry.url or entry.doi or entry.eprint %}
      <br>
      {% if entry.url %}
        <a href="{{ entry.url }}" target="_blank" rel="noopener">[Journal]</a>
      {% endif %}
      {% if entry.doi %}
        <a href="https://doi.org/{{ entry.doi }}" target="_blank" rel="noopener">[DOI]</a>
      {% endif %}
      {% if entry.eprint %}
        <a href="https://arxiv.org/abs/{{ entry.eprint }}" target="_blank" rel="noopener">[arXiv]</a>
      {% endif %}
    {% endif %}
  </p>
</div>
